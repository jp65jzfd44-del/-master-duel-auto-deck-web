name: Deploy Master Duel PWA

on:
  push:
    branches: [main]
    paths:
      - 'pwa_parts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and extract PWA
        run: |
          set -euxo pipefail
          cat pwa_parts/part-*.txt | tr -d '\n\r' | base64 --decode > MasterDuelAutoDeck_PWA_v1.zip
          unzip -t MasterDuelAutoDeck_PWA_v1.zip
          rm -rf _site _src
          mkdir -p _site _src
          unzip -q MasterDuelAutoDeck_PWA_v1.zip -d _src
          cp -R _src/MasterDuelAutoDeck_PWA_v1/. _site/
          rm -f _site/README_PWA_JA.txt _site/SOURCES.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
