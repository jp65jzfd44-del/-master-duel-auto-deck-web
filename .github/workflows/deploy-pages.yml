name: Deploy Master Duel PWA

on:
  push:
    branches: [main]
    paths:
      - 'MasterDuelAutoDeck_PWA_v1.zip'
      - 'patch_parts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base PWA
        run: |
          set -euxo pipefail
          unzip -t MasterDuelAutoDeck_PWA_v1.zip
          rm -rf _site _src
          mkdir -p _site _src
          unzip -q MasterDuelAutoDeck_PWA_v1.zip -d _src
          cp -R _src/MasterDuelAutoDeck_PWA_v1/. _site/

      - name: Apply PWA v2 quality patch
        run: |
          set -euxo pipefail
          cat patch_parts/v2-*.b64 | tr -d '\n\r' | base64 --decode | gzip -dc > pwa_patch_v2.py
          python3 pwa_patch_v2.py _site
          node --check _site/app.js
          grep -q "CRパチンコ型" _site/index.html
          grep -q "構築完成度" _site/app.js
          rm -f _site/README_PWA_JA.txt _site/SOURCES.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
