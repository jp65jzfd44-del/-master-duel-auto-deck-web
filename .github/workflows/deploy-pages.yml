name: Deploy Master Duel PWA

on:
  push:
    branches: [main]
    paths:
      - 'MasterDuelAutoDeck_PWA_v1.zip'
      - '.github/workflows/deploy-pages.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PWA
        run: |
          set -euxo pipefail
          unzip -t MasterDuelAutoDeck_PWA_v1.zip
          rm -rf _site _src
          mkdir -p _site _src
          unzip -q MasterDuelAutoDeck_PWA_v1.zip -d _src
          cp -R _src/MasterDuelAutoDeck_PWA_v1/. _site/
          rm -f _site/README_PWA_JA.txt _site/SOURCES.txt

      - name: Apply quality v2 patch
        run: |
          set -euxo pipefail
          cat patches/v2-compact.gz.b64 | tr -d '\n\r' | base64 --decode | gunzip > /tmp/pwa_patch_v2.py
          python3 /tmp/pwa_patch_v2.py _site
          node --check _site/app.js

      - name: Apply quality v3 patch
        run: |
          set -euxo pipefail
          cat patches/v3-compact.gz.b64 | tr -d '\n\r' | base64 --decode | gunzip > /tmp/pwa_patch_v3.py
          python3 /tmp/pwa_patch_v3.py _site
          node --check _site/app.js

      - name: Apply quality v3 patch
        run: |
          set -euxo pipefail
          cat patches/v3-quality.gz.b64 | tr -d '\n\r' | base64 --decode | gunzip > /tmp/pwa_patch_v3.py
          python3 /tmp/pwa_patch_v3.py _site
          node --check _site/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
