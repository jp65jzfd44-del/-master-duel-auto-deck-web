name: Deploy Master Duel PWA

on:
  push:
    branches: [main]
    paths:
      - 'MasterDuelAutoDeck_PWA_v1.zip'
      - '.github/workflows/deploy-pages.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PWA
        run: |
          set -euxo pipefail
          unzip -t MasterDuelAutoDeck_PWA_v1.zip
          rm -rf _site _src
          mkdir -p _site _src
          unzip -q MasterDuelAutoDeck_PWA_v1.zip -d _src
          cp -R _src/MasterDuelAutoDeck_PWA_v1/. _site/
          rm -f _site/README_PWA_JA.txt _site/SOURCES.txt

      - name: Apply quality v2 patch
        run: |
          set -euxo pipefail
          cat patches/v2-compact.gz.b64 | tr -d '\n\r' | base64 --decode | gunzip > /tmp/pwa_patch_v2.py
          python3 /tmp/pwa_patch_v2.py _site
          node --check _site/app.js

      - name: Apply quality v3 patch
        run: |
          set -euxo pipefail
          cat patches/v3-compact.gz.b64 | tr -d '\n\r' | base64 --decode | gunzip > /tmp/pwa_patch_v3.py
          python3 /tmp/pwa_patch_v3.py _site
          node --check _site/app.js

      - name: Add detailed guide v4
        run: |
          set -euxo pipefail
          cp patches/guide-v4.css _site/guide-v4.css
          cat patches/guide-v4-*.b64 | tr -d '\n\r' | base64 --decode | gunzip > _site/guide-v4.js
          node --check _site/guide-v4.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'guide-v4.css' not in s:
              s=s.replace('<link rel="stylesheet" href="styles.css" />','<link rel="stylesheet" href="styles.css" />\n  <link rel="stylesheet" href="guide-v4.css" />')
          if 'guide-v4.js' not in s:
              s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n  <script src="guide-v4.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add strategy builder v5
        run: |
          set -euxo pipefail
          cp patches/strategy-v5.js _site/strategy-v5.js
          cp patches/strategy-v5.css _site/strategy-v5.css
          node --check _site/strategy-v5.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'strategy-v5.css' not in s:
              s=s.replace('<link rel="stylesheet" href="guide-v4.css" />','<link rel="stylesheet" href="guide-v4.css" />\n  <link rel="stylesheet" href="strategy-v5.css" />')
          if 'strategy-v5.js' not in s:
              s=s.replace('<script src="guide-v4.js"></script>','<script src="guide-v4.js"></script>\n  <script src="strategy-v5.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply strategy scoring v5
        run: |
          set -euxo pipefail
          rm -rf /tmp/strategy-v5-deep
          mkdir -p /tmp/strategy-v5-deep
          cat patches/strategy-v5-deep.tgz.b64 | tr -d '\n\r' | base64 --decode > /tmp/strategy-v5-deep.tgz
          tar -xzf /tmp/strategy-v5-deep.tgz -C /tmp/strategy-v5-deep
          python3 /tmp/strategy-v5-deep/patch_app_strategy_integration_v5.py _site
          cp /tmp/strategy-v5-deep/strategy-v5-score.js _site/strategy-v5-score.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'strategy-v5-score.js' not in s:
              s=s.replace('<script src="strategy-v5.js"></script>','<script src="strategy-v5.js"></script>\n  <script src="strategy-v5-score.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          node --check _site/app.js
          node --check _site/strategy-v5.js
          node --check _site/strategy-v5-score.js

      - name: Add hybrid builder v6
        run: |
          set -euxo pipefail
          cp patches/hybrid-v6.js _site/hybrid-v6.js
          cp patches/hybrid-v6.css _site/hybrid-v6.css
          node --check _site/hybrid-v6.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'hybrid-v6.css' not in s:
              s=s.replace('<link rel="stylesheet" href="strategy-v5.css" />','<link rel="stylesheet" href="strategy-v5.css" />\n  <link rel="stylesheet" href="hybrid-v6.css" />')
          if 'hybrid-v6.js' not in s:
              s=s.replace('<script src="strategy-v5.js"></script>','<script src="strategy-v5.js"></script>\n  <script src="hybrid-v6.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Refresh PWA cache version
        run: |
          set -euxo pipefail
          sed -i 's/md-auto-deck-pwa-v[0-9][0-9]*/md-auto-deck-pwa-v6/g' _site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/sw.js')
          s=p.read_text(encoding='utf-8')
          additions=["'./guide-v4.css'","'./guide-v4.js'","'./strategy-v5.css'","'./strategy-v5.js'","'./strategy-v5-score.js'","'./hybrid-v6.css'","'./hybrid-v6.js'"]
          anchor="'./default-regulation.json', './manifest.webmanifest', './icon.svg'"
          if anchor in s:
              extra=', '.join(x for x in additions if x not in s)
              if extra:
                  s=s.replace(anchor, anchor+', '+extra)
          p.write_text(s,encoding='utf-8')
          PY
          grep "const CACHE" _site/sw.js
          grep "strategy-v5" _site/sw.js
          grep "hybrid-v6" _site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
